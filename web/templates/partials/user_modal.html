<!--
  회원가입(signup) / 관리자 유저추가(create) / 관리자 유저수정(edit) 3가지 모드를 공유하는 단일 모달.
  실제 표시 형태는 static/js/user_modal.js의 openUserModal(mode, prefill) 이 결정한다.
  이 파셜은 페이지당 한 번만 include 하면 된다 (로그인 페이지, 유저관리 페이지 각각).
-->
<div class="modal-overlay" id="user-modal-overlay">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="user-modal-title">회원가입</h2>
      <button type="button" class="modal-close" data-modal-close aria-label="닫기">&times;</button>
    </div>

    <div class="form-notice" id="user-modal-notice"></div>

    <form id="user-modal-form">
      <div class="field">
        <label for="user-modal-user-id">아이디</label>
        <input id="user-modal-user-id" name="user_id" type="text" placeholder="영문/숫자 4~20자">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="user-modal-passwd" id="label-user-modal-passwd">비밀번호</label>
          <input id="user-modal-passwd" name="passwd" type="password" placeholder="8자 이상">
        </div>
        <div class="field" id="field-passwd-confirm">
          <label for="user-modal-passwd-confirm">비밀번호 확인</label>
          <input id="user-modal-passwd-confirm" name="passwd_confirm" type="password">
        </div>
      </div>

      <div class="field">
        <label for="user-modal-name">이름</label>
        <input id="user-modal-name" name="name" type="text" required>
      </div>

      <div class="field">
        <label for="user-modal-department">부서명</label>
        <input id="user-modal-department" name="department" type="text" required>
      </div>

      <div class="field field-row" id="field-admin-status">
        <label class="checkbox-field">
          <input type="checkbox" id="user-modal-is-admin" name="is_admin">
          관리자 권한
        </label>
        <label class="checkbox-field">
          <input type="checkbox" id="user-modal-is-disabled" name="is_disabled">
          계정 비활성화
        </label>
      </div>

      <div class="field" id="field-signup-hint">
        <label class="field-hint">ℹ️ 이용 내역 및 채팅 내역은 서비스 개선을 위해 분석됩니다.</label>
      </div>

      <button type="submit" class="btn-primary accent" id="user-modal-submit">가입하기</button>
    </form>
  </div>
</div>
