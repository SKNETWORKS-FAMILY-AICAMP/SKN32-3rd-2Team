<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · Smart HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-wrap">
    <div class="brand">
      <img src="/static/img/logo.png" alt="" class="brand-logo-login">
    </div>

    <div class="login-card">
      <span class="corner-bl"></span>
      <span class="corner-br"></span>
      <h1>로그인</h1>

      {% if error %}
      <div class="form-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/auth/login">
        <div class="field">
          <label for="login-user-id">아이디</label>
          <input id="login-user-id" name="user_id" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-passwd">비밀번호</label>
          <input id="login-passwd" name="passwd" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">로그인</button>
      </form>
    </div>

    <div class="login-footer">
      계정이 없으신가요?
      <button type="button" id="open-signup">회원가입</button>
    </div>
  </div>
</div>

<!-- 회원가입 모달 -->
<div class="modal-overlay" id="signup-overlay">
  <div class="modal-card">
    <div class="modal-head">
      <h2>회원가입</h2>
      <button type="button" class="modal-close" id="close-signup" aria-label="닫기">&times;</button>
    </div>

    <div class="form-notice" id="signup-notice"></div>

    <form id="signup-form">
      <div class="field">
        <label for="signup-user-id">아이디</label>
        <input id="signup-user-id" name="user_id" type="text" placeholder="영문/숫자 4~20자" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="signup-passwd">비밀번호</label>
          <input id="signup-passwd" name="passwd" type="password" placeholder="8자 이상" required>
        </div>
        <div class="field">
          <label for="signup-passwd-confirm">비밀번호 확인</label>
          <input id="signup-passwd-confirm" name="passwd_confirm" type="password" required>
        </div>
      </div>
      <div class="field">
        <label for="signup-name">이름</label>
        <input id="signup-name" name="name" type="text" required>
      </div>
      <div class="field">
        <label for="signup-department">부서명</label>
        <input id="signup-department" name="department" type="text" required>
      </div>
      <div class="field">
        <label>ℹ️ 이용 내역 및 채팅 내역은 서비스 개선을 위해 분석됩니다.</label>
      </div>
      <button type="submit" class="btn-primary accent">가입하기</button>
    </form>
  </div>
</div>

<script src="/static/js/login.js"></script>
</body>
</html>
